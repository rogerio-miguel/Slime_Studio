      <div class="episode-card">
        <a href="https://animesdrive.online/episodio/tensei-shitara-slime-datta-ken-episodio-3">

        </a>
        <a href="https://animesdrive.online/episodio/tensei-shitara-slime-datta-ken-episodio-3">
          Episódio 3
        </a>
      </div>

      <div class="episode-card">
        <a href="https://animesdrive.online/episodio/tensei-shitara-slime-datta-ken-episodio-1">
          <img src="/thumb1.jpg" alt="">
        </a>
        <a href="https://animesdrive.online/episodio/tensei-shitara-slime-datta-ken-episodio-1">
          Episódio 1
        </a>
      </div>

      <div class="episode-card">
        <a href="https://animesdrive.online/episodio/tensei-shitara-slime-datta-ken-episodio-2">
          <img src="/thumb2.jpg" alt="">
        </a>
        <a href="https://animesdrive.online/episodio/tensei-shitara-slime-datta-ken-episodio-2">

        </a>

          Assistir todos os episódios

  <aside class="widget">
    <a href="https://animesdrive.online/episodio/outro-anime-episodio-5">
      Anime relacionado - Episódio 5
