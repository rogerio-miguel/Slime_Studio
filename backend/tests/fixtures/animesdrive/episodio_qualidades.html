<!DOCTYPE html>
<html>
<body>
  <div class="animeq-player">
    <div class="animeq-switches">
      <button data-animeq-switch="0" data-source-name="SD" class="is-active">SD</button>
      <button data-animeq-switch="1" data-source-name="HD">HD</button>
      <button data-animeq-switch="2" data-source-name="FHD">FHD</button>
    </div>
    <div data-animeq-source="0" class="is-active">
      <video><source src="https://animes.click/sd.mp4"></video>
    </div>
    <div data-animeq-source="1">
      <iframe data-lazy-src="https://draft.blogger.com/video.g?token=hd" src="about:blank"></iframe>
    </div>
    <div data-animeq-source="2">
      <video><source src="https://aniplay.online/fhd.mp4"></video>
    </div>
  </div>
</body>
</html>
