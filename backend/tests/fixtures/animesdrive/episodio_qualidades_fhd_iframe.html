<!DOCTYPE html>
<html>
<body>
  <div class="animeq-player">
    <div class="animeq-switches">
      <button data-animeq-switch="0" data-source-name="Mobile / Celular" class="is-active">
        Mobile / Celular
      </button>
      <button data-animeq-switch="1" data-source-name="FullHD / HLS">FullHD / HLS</button>
      <button data-animeq-switch="2" data-source-name="FHD">FHD</button>
      <button data-animeq-switch="3" data-source-name="FHD">FHD</button>
    </div>
    <div data-animeq-source="0" class="is-active">
      <iframe data-lazy-src="https://blogger.com/video.g?token=mobile" src="about:blank"></iframe>
    </div>
    <div data-animeq-source="1">
      <video><source src="https://aniplay.online/fullhd.m3u8"></video>
    </div>
    <div data-animeq-source="2">
      <iframe data-lazy-src="https://animeshd.cloud/embed/aaa" src="about:blank"></iframe>
    </div>
    <div data-animeq-source="3">
      <iframe data-lazy-src="https://animes.strp2p.com/e/bbb" src="about:blank"></iframe>
    </div>
  </div>
</body>
</html>
